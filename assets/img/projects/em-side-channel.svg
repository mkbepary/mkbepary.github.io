  <text x="742" y="249" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#365e5a">Pre-silicon analysis</text>
  <rect x="170" y="385" width="620" height="76" rx="16" fill="#ffffff" stroke="#d5dedb" stroke-width="2"/>
  <text x="480" y="429" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#233333">Find EM leakage before tapeout</text>
