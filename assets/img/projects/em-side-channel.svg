<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Electromagnetic side-channel assessment flow</title>
  <desc id="desc">A gate-level design emits electromagnetic leakage that is modeled and assessed before silicon.</desc>
  <rect width="960" height="560" rx="28" fill="#fbfcf8"/>
  <rect x="90" y="145" width="230" height="180" rx="20" fill="#eaf0ff" stroke="#425fb0" stroke-width="3"/>
  <text x="205" y="214" text-anchor="middle" font-family="Inter,Arial" font-size="25" font-weight="700" fill="#263c76">Gate-level</text>
  <text x="205" y="249" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#4b5f8a">Physical design</text>
  <path d="M390 285c45-95 95-95 140 0" fill="none" stroke="#13a38f" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 285c30-62 65-62 95 0" fill="none" stroke="#13a38f" stroke-width="6" stroke-linecap="round"/>
