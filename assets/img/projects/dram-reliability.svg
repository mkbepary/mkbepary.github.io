<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">DRAM reliability and retention testing workflow</title>
  <desc id="desc">A workflow showing FPGA control, DRAM stress, retention errors, and reliability analysis.</desc>
  <rect width="960" height="560" rx="28" fill="#f7faf9"/>
  <rect x="90" y="120" width="190" height="140" rx="18" fill="#dff5f0" stroke="#1b8a7a" stroke-width="3"/>
  <text x="185" y="176" text-anchor="middle" font-family="Inter,Arial" font-size="26" font-weight="700" fill="#133b3a">FPGA</text>
  <text x="185" y="212" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#315b59">Timing control</text>
  <rect x="385" y="100" width="190" height="180" rx="18" fill="#eaf0ff" stroke="#4267b2" stroke-width="3"/>
  <text x="480" y="176" text-anchor="middle" font-family="Inter,Arial" font-size="26" font-weight="700" fill="#213a70">DDR3 DRAM</text>
  <text x="480" y="212" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#40527d">Stress + refresh</text>
  <rect x="680" y="120" width="190" height="140" rx="18" fill="#fff4dc" stroke="#bb7a12" stroke-width="3"/>
  <text x="775" y="176" text-anchor="middle" font-family="Inter,Arial" font-size="26" font-weight="700" fill="#6e4709">Errors</text>
  <text x="775" y="212" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#765b2e">Retention profile</text>
  <path d="M285 190h90" stroke="#667085" stroke-width="6" stroke-linecap="round"/>
  <path d="M365 174l22 16-22 16" fill="none" stroke="#667085" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M580 190h90" stroke="#667085" stroke-width="6" stroke-linecap="round"/>
  <path d="M660 174l22 16-22 16" fill="none" stroke="#667085" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="190" y="360" width="580" height="92" rx="18" fill="#ffffff" stroke="#ccd5d5" stroke-width="2"/>
  <text x="480" y="398" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="700" fill="#233333">Aging-aware reliability analysis</text>
  <text x="480" y="430" text-anchor="middle" font-family="Inter,Arial" font-size="18" fill="#526060">Control parameters, observe bit flips, build robust signatures</text>
</svg>
