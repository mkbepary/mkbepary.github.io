<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">PMU-based side-channel profiling workflow</title>
  <desc id="desc">Performance counters are collected, classified, and used to infer workload activity.</desc>
  <rect width="960" height="560" rx="28" fill="#f8fbff"/>
  <rect x="100" y="115" width="190" height="130" rx="18" fill="#eaf0ff" stroke="#4267b2" stroke-width="3"/>
  <text x="195" y="170" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="700" fill="#213a70">Workload</text>
  <text x="195" y="204" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#4b5f8a">Remote activity</text>
  <rect x="385" y="115" width="190" height="130" rx="18" fill="#dff5f0" stroke="#168476" stroke-width="3"/>
  <text x="480" y="170" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="700" fill="#143c39">PMU</text>
  <text x="480" y="204" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#365e5a">Counters</text>
  <rect x="670" y="115" width="190" height="130" rx="18" fill="#fff2df" stroke="#b96d18" stroke-width="3"/>
  <text x="765" y="170" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="700" fill="#724006">Profile</text>
  <text x="765" y="204" text-anchor="middle" font-family="Inter,Arial" font-size="17" fill="#725633">Inferred class</text>
  <path d="M295 180h80" stroke="#667085" stroke-width="6" stroke-linecap="round"/>
  <path d="M365 164l22 16-22 16" fill="none" stroke="#667085" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M580 180h80" stroke="#667085" stroke-width="6" stroke-linecap="round"/>
  <path d="M650 164l22 16-22 16" fill="none" stroke="#667085" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="180,400 250,350 320,382 390,320 460,360 530,300 600,332 680,275 760,312" fill="none" stroke="#168476" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="458" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#233333">Counter traces reveal workload behavior</text>
</svg>
