<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Secure silicon implementation flow</title>
  <desc id="desc">A secure silicon workflow from RTL assessment to security primitive integration and signoff.</desc>
  <rect width="960" height="560" rx="28" fill="#f8fbff"/>
  <rect x="90" y="115" width="170" height="120" rx="18" fill="#eaf0ff" stroke="#4967ad" stroke-width="3"/>
