  <path d="M635 175h55" stroke="#667085" stroke-width="6" stroke-linecap="round"/>
  <path d="M682 159l22 16-22 16" fill="none" stroke="#667085" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
